services:
  mongo:
    image: mongo:latest
    container_name: clf-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: clf-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/campus_lost_found
      JWT_SECRET: ${JWT_SECRET:-super-secret-campus-jwt}
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_NAME: ${SENDER_NAME:-Campus Lost & Found}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  seed:
    build: ./backend
    container_name: clf-seed
    restart: "no"
    environment:
      MONGO_URI: mongodb://mongo:27017/campus_lost_found
      JWT_SECRET: ${JWT_SECRET:-super-secret-campus-jwt}
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run seed

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: clf-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: