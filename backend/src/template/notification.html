<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#eef2ff;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2ff;padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(54,36,179,.10);">
          <tr>
            <td style="background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:24px 32px;text-align:center;">
              <div style="font-size:20px;font-weight:800;color:#ffffff;letter-spacing:.5px;">{{brand}}</div>
              <div style="font-size:12px;color:#c7d2fe;margin-top:4px;">Lost &amp; Found</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8b5cf6;">{{type}}</p>
              <h1 style="margin:0 0 12px;font-size:19px;color:#1e1b4b;">{{title}}</h1>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#475569;">{{message}}</p>
              {{#actionLink}}
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                <tr>
                  <td style="border-radius:12px;background:#4f46e5;">
                    <a href="{{actionUrl}}" style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;">{{actionLabel}}</a>
                  </td>
                </tr>
              </table>
              {{/actionLink}}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px;background:#f8fafc;text-align:center;">
              <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#64748b;">
                This is an automatic notification from {{brand}}. If you have questions, contact the campus security desk.
              </p>
              <p style="margin:0;font-size:11px;color:#94a3b8;">&copy; {{year}} {{brand}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
