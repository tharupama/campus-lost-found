{{>open}}
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8b5cf6;">New feedback</p>
              <h1 style="margin:0 0 12px;font-size:19px;color:#1e1b4b;">{{senderName}} sent feedback</h1>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#475569;">
                Hi {{greetingName}}, a student submitted feedback on {{brand}}. Details below.
              </p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:12px;padding:18px 20px;margin:0 0 20px;">
                <tr>
                  <td style="padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;">From</td>
                  <td style="padding:4px 0;font-size:14px;color:#1e1b4b;font-weight:700;">{{senderName}}</td>
                </tr>
                <tr>
                  <td style="padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;">Email</td>
                  <td style="padding:4px 0;font-size:14px;color:#1e1b4b;word-break:break-all;">
                    <a href="mailto:{{senderEmail}}" style="color:#4f46e5;text-decoration:none;">{{senderEmail}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;">Category</td>
                  <td style="padding:4px 0;font-size:14px;color:#1e1b4b;">{{categoryLabel}}</td>
                </tr>
              </table>

              <p style="margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;">Message</p>
              <div style="border-left:3px solid #4f46e5;padding:2px 0 2px 16px;margin:0 0 24px;">
                <p style="margin:0 0 12px;font-size:14px;line-height:1.7;color:#475569;">{{{messageHtml}}}</p>
              </div>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0;">
                <tr>
                  <td style="border-radius:12px;background:#4f46e5;">
                    <a href="{{actionUrl}}" style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;">Review in CampusLost</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
{{>close}}
